[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "canonprims"
version = "0.1.3"
description = "Canonical serialization for structured data: RFC 8785 JSON over a strict I-JSON loader"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["canonicalization", "rfc8785", "jcs", "json"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.urls]
Repository = "https://github.com/3leaps/canonprims"

[tool.maturin]
python-source = "python"
module-name = "canonprims._canonprims"
features = []

# maturin's Rust SBOM records path dependencies as absolute file:// URLs of
# the build host. The release ships its own SBOM (sbom-<version>.cdx.json) for
# the tagged commit, so the wheel carries none.
[tool.maturin.sbom]
rust = false
