# goneat tools configuration: host tools for development and the release
# ceremony, with a recommended minimum for each. `make doctor`
# (scripts/doctor.py) reports every tool's version against its minimum and
# fails when one is missing, older, or unreadable. It reads each version with
# the pattern in config/doctor-versions.txt rather than goneat's comparison,
# which skips two-part versions such as jq-1.6.
#
# The minimums are recommendations: the versions this repository is known to
# work with, not proven lower bounds. Older versions may work; YMMV. Three are
# floors for a stated reason: jq 1.6 rejects a jq keyword used as a variable
# name, the release scripts require Python 3.11 themselves, and the yamlprims
# minimum is the one scripts/yaml_json.py enforces (config/yamlprims-cli.txt).
#
# yamlprims is not looked up on PATH: its detect_command (run from the
# repository root) authenticates the binary named by CANONPRIMS_YAMLPRIMS_BIN
# against the SHA-256 digests committed in config/yamlprims-cli.txt, then reads
# the version of that authenticated copy (scripts/yaml_json.py). The contract
# probe and the minimum are checked by the workflow checkers, not here.
#
# Validate with: goneat doctor tools --config .goneat/tools.yaml --validate-config
scopes:
  release:
    description: Host tools the maintainer release ceremony runs
    tools: [git, gh, jq, python3, gpg, minisign, npm, uv, yamlprims]
  dev:
    description: Host tools for make check
    tools: [git, jq, python3, go, yamlprims]
tools:
  git:
    name: git
    description: Version control; tags, ls-remote and archive in the release scripts
    kind: system
    detect_command: git --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [brew]
      windows: [scoop, winget]
    version_scheme: semver
    minimum_version: 2.38.0
  gh:
    name: gh
    description: GitHub CLI; release drafts, run downloads and verification reads
    kind: system
    detect_command: gh --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [brew]
      windows: [scoop, winget]
    version_scheme: semver
    minimum_version: 2.40.0
  jq:
    name: jq
    description: JSON processor in the release scripts (1.6 rejects keyword variable names)
    kind: system
    detect_command: jq --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [brew]
      windows: [scoop, winget]
    version_scheme: semver
    minimum_version: 1.7.0
  python3:
    name: python3
    description: Release and corpus scripts (3.11 or newer is enforced by the scripts)
    kind: system
    detect_command: python3 --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [brew]
      windows: [scoop, winget]
    version_scheme: semver
    minimum_version: 3.11.0
  gpg:
    name: gpg
    description: OpenPGP tag and manifest signing and verification
    kind: system
    detect_command: gpg --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [brew]
      windows: [scoop, winget]
    version_scheme: semver
    minimum_version: 2.2.0
  minisign:
    name: minisign
    description: Release manifest signing and verification
    kind: system
    detect_command: minisign -v
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [brew]
      windows: [scoop]
    version_scheme: semver
    minimum_version: 0.11.0
  npm:
    name: npm
    description: npm registry verification and first-publish upload (OIDC workflow uses >= 11.5.1)
    kind: system
    detect_command: npm --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [brew]
      windows: [scoop, winget]
    version_scheme: semver
    minimum_version: 10.0.0
  uv:
    name: uv
    description: Isolated tool runner (uvx twine upload for first-publish PyPI upload)
    kind: system
    detect_command: uv --version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [brew]
      windows: [scoop, winget]
    version_scheme: semver
    minimum_version: 0.5.0
  go:
    name: go
    description: Go toolchain for the pure-Go implementation
    kind: go
    detect_command: go version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [brew]
      linux: [brew]
      windows: [scoop, winget]
    version_scheme: semver
    minimum_version: 1.21.0
  yamlprims:
    name: yamlprims
    description: YAML reader for the workflow checkers (CANONPRIMS_YAMLPRIMS_BIN; CI and release validation only)
    kind: system
    detect_command: python3 -I -B scripts/yaml_json.py version
    platforms: [darwin, linux, windows]
    installer_priority:
      darwin: [manual]
      linux: [manual]
      windows: [manual]
    version_scheme: semver
    minimum_version: 0.1.0
