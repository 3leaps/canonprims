name: make check
description: Install the pinned toolchain and tools, run make check, and require an unchanged tree.
inputs:
  target:
    description: Expected native host triple.
    required: true
  rust-toolchain:
    description: Rust toolchain (the workspace MSRV).
    required: true
  go-version:
    description: Go toolchain (the estate floor).
    required: true
  node-version:
    description: Node.js, used only as an independent corpus witness.
    required: true
runs:
  using: composite
  steps:
    - name: Install Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"

    - name: Install Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Install Node (ECMAScript corpus witness)
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # reviewed 2026-08-04 commit
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: rustfmt, clippy

    - name: Verify native host and toolchain
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        TOOLCHAIN: ${{ inputs.rust-toolchain }}
      run: |
        host=$(rustc -vV | awk '/^host:/{print $2}')
        test "${host}" = "${TARGET}"
        rustc --version | grep "^rustc ${TOOLCHAIN} "
        grep -qx "rust-version = \"${TOOLCHAIN}\"" Cargo.toml
        python --version
        go version
        node --version

    - name: Install pinned tools
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        tmp="$(cygpath -u "${RUNNER_TEMP}" 2>/dev/null || echo "${RUNNER_TEMP}")"
        dest="$(scripts/ci-install-tools.sh "${TARGET}" "${tmp}/ci-tools")"
        (cygpath -w "${dest}" 2>/dev/null || echo "${dest}") >> "${GITHUB_PATH}"

    - name: Install pinned Python packages
      shell: bash
      run: scripts/ci-install-pyyaml.sh python

    - name: Ensure make
      shell: bash
      run: |
        if ! command -v make > /dev/null; then
          echo "make is required on the runner" >&2
          exit 1
        fi
        make --version | head -1

    - name: make check
      shell: bash
      run: |
        goneat version | grep '^Module: v0\.6\.1$'
        cargo deny --version
        make check PYTHON=python

    - name: Working tree unchanged by the gate
      shell: bash
      run: |
        git status --porcelain
        test -z "$(git status --porcelain)"
